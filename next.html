<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy New Year 🎆</title>

<style>
:root {
  --gold: #f5c542;
  --red: #ff3b3b;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #1a1a2e, #000);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
}

/* CONTENT */
.container {
  z-index: 100;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  animation: fadeIn 1.2s ease;
}

h1 {
  font-size: 2.4rem;
  margin-bottom: 10px;
  color: var(--gold);
  text-shadow: 0 0 15px rgba(245,197,66,0.8);
}

p {
  font-size: 1.05rem;
  opacity: 0.9;
}

button {
  margin-top: 20px;
  padding: 14px 30px;
  font-size: 1.1rem;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, var(--red), var(--gold));
  color: #111;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(255,80,80,0.6);
}

/* CONFETTI */
.confetti {
  position: absolute;
  width: 8px;
  height: 16px;
  top: -20px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* FIREWORKS CANVAS */
canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container" id="content">
  <h1>🎆 Happy New Year 🎆</h1>
  <p>Tap below to begin the celebration</p>
  <button onclick="startCelebration()">Start 🎉</button>
</div>

<!-- SOUND -->
<audio id="newYearSound">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_5bdf5c62b7.mp3" type="audio/mpeg">
</audio>

<script>
/* CONFETTI */
function createConfetti() {
  const colors = ["#f5c542", "#ff3b3b", "#4dd599", "#4da6ff", "#ffffff"];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(c);
  }
}

/* FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

function firework(x, y) {
  for (let i = 0; i < 80; i++) {
    particles.push({
      x,
      y,
      angle: Math.random() * Math.PI * 2,
      speed: Math.random() * 6 + 2,
      life: 60,
      color: `hsl(${Math.random()*360},100%,60%)`
    });
  }
}

function animateFireworks() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach((p, i) => {
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    p.life--;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
    ctx.fill();
    if (p.life <= 0) particles.splice(i,1);
  });
  requestAnimationFrame(animateFireworks);
}

/* MAIN */
function startCelebration() {
  const name = prompt("Enter your name:");
  if (!name) return;

  document.getElementById("content").innerHTML = `
    <h1>🎉 Happy New Year, ${name}! 🎉</h1>
    <p>May this year bring you joy, success, and peace ✨</p>
  `;

  document.getElementById("newYearSound").play();
  createConfetti();

  setInterval(() => {
    firework(
      Math.random() * canvas.width,
      Math.random() * canvas.height * 0.6
    );
  }, 600);

  animateFireworks();
}
</script>

</body>
</html>
